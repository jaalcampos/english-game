      user-select: none;
    }

    h1, h2, h3, .font-fun {
      font-family: 'Fredoka', cursive;
    }

    .btn-pop {
      transition: all 0.15s ease-out;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
    }
    .btn-pop:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.15);
    }
    .btn-pop:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); }
      50% { transform: scale(1.05); }
      100% { transform: scale(0.95); }
    }
    .speaker-pulse {
      animation: pulse-ring 2s infinite;
    }

    canvas {
      touch-action: none;
    }

      canvas = document.getElementById('paint-canvas');
      ctx = canvas.getContext('2d');

      setupCanvasResize();
      setupDrawingEvents();
      loadExercise(0);
    });

    function setupCanvasResize() {
      const container = document.getElementById('canvas-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
    }

    window.addEventListener('resize', () => {
      setupCanvasResize();
    });

    function setupDrawingEvents() {
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        startDrawing({ clientX: touch.clientX, clientY: touch.clientY });
      });
      canvas.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        draw({ clientX: touch.clientX, clientY: touch.clientY });
        e.preventDefault();
      });
      canvas.addEventListener('touchend', stopDrawing);
    }

    function startDrawing(e) {
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      ctx.beginPath();
      ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function draw(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
    }

    function setColor(color) {
      currentColor = color;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    /* ============================================================
        LÓGICA DEL JUEGO
    ============================================================ */
    function loadExercise(index) {
      currentIndex = index;
      const current = exercises[index];

      document.getElementById('current-q').innerText = index + 1;
      document.getElementById('total-q').innerText = exercises.length;
      document.getElementById('instruction-text').innerText = current.instruction;

      const bgContainer = document.getElementById('scene-bg');
      bgContainer.innerHTML = current.render();

      setTimeout(() => {
        setupCanvasResize();
        clearCanvas();
      }, 50);

      setTimeout(() => {
        speakInstruction();
      }, 400);
    }

    function nextQuestion() {
      if (currentIndex + 1 < exercises.length) {
        loadExercise(currentIndex + 1);
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('game-card').classList.add('hidden');
      document.getElementById('results-card').classList.remove('hidden');
      if (typeof confetti === 'function') {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }
    }

    function resetGame() {
      document.getElementById('results-card').classList.add('hidden');
      document.getElementById('game-card').classList.remove('hidden');
      loadExercise(0);
    }

    function goHome() {
      window.location.href = 'index.html';
    }

    /* ============================================================
        SISTEMA DE VOZ Y VALIDACIÓN
    ============================================================ */
    function speakInstruction() {
      const current = exercises[currentIndex];
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(current.audioText);
        utterance.lang = 'en-US';
        utterance.rate = 0.8;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function selectArticle(selected, btn) {
      document.querySelectorAll('.choice-btn').forEach(b => {
        b.classList.remove('bg-emerald-500', 'text-white', 'border-emerald-600');
      });
      if (selected === 'a') {
        btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
        if (typeof confetti === 'function') {
          confetti({ particleCount: 40, spread: 50, origin: { y: 0.7 } });
        }
      }
    }
  </script>
</body>
</html>
