  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #a78bfa 0%, #ec4899 100%);
      min-height: 100vh;
      user-select: none;
    }

    h1, h2, h3, .font-fun {
      font-family: 'Fredoka', cursive;
    }

    /* Sad faces animation overlay */
    #sad-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }

    .sad-face {
      position: absolute;
      font-size: 2.5rem;
      animation: fallDown 2.5s linear forwards;
      opacity: 0.9;
    }

    @keyframes fallDown {
      0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.2;
      }
    }

    .btn-pop {
      transition: all 0.15s ease-out;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
    }
    .btn-pop:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.15);
    }
    .btn-pop:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); }
      50% { transform: scale(1.05); }
      100% { transform: scale(0.95); }
    }
    .speaker-pulse {
      animation: pulse-ring 2s infinite;
    }

    .letter-box {
      width: 50px;
      height: 60px;
      border-bottom: 4px solid #7c3aed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: bold;
      color: #1e293b;
    }

    .keyboard-btn {
      width: 45px;
      height: 45px;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .keyboard-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    #hangman-canvas {
      border: 4px solid #7c3aed;
      border-radius: 1rem;
      background: white;
    }
  </style>
</head>

      <!-- Keyboard -->

        <div id="keyboard" class="flex flex-wrap gap-2 justify-center">

        </div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap items-center justify-center gap-4 mt-6">
        <button onclick="nextWord()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-6 py-3 rounded-xl text-sm transition btn-pop flex items-center gap-2 shadow-lg">
          Next Word <i class="fa-solid fa-arrow-right"></i>

      </div>

    </section>

    <!-- Results Screen -->
    <section id="results-card" class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl p-8 text-center shadow-2xl border-4 border-white hidden">
      <div class="w-24 h-24 bg-pink-100 text-pink-500 rounded-full flex items-center justify-center text-5xl mx-auto mb-4 shadow-inner border-2 border-pink-300">

      <p class="text-slate-600 font-medium mb-2">Your Final Score:</p>

        <button onclick="goHome()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3.5 px-6 rounded-2xl transition btn-pop flex items-center justify-center gap-2">

    </section>

        { word: "NOSE", emoji: "👃", hint: "You smell with this" },
        { word: "MOUTH", emoji: "👄", hint: "You eat and talk with this" },
        { word: "ARM", emoji: "💪", hint: "Between your shoulder and hand" },
        { word: "LEG", emoji: "🦵", hint: "Between your hip and foot" },
      ],
      adjectives: [
        { word: "BIG", emoji: "🐘", hint: "Very large" },
        { word: "SMALL", emoji: "🐭", hint: "Very little" },
        { word: "HAPPY", emoji: "😊", hint: "Feeling good and smiling" },
        { word: "SAD", emoji: "😢", hint: "Feeling like crying" },
        { word: "FULL", emoji: "🔋", hint: "Not empty, all filled" },
        { word: "HOT", emoji: "🔥", hint: "Very warm" },
        { word: "COLD", emoji: "🧊", hint: "Like ice" },
        { word: "FAST", emoji: "🏃", hint: "Moving quickly" },
        { word: "SLOW", emoji: "🐌", hint: "Not fast" },
        { word: "TALL", emoji: "🦒", hint: "Very high" },
      ]
    };

    const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const MAX_ERRORS = 6;

    /* ============================================================
        GAME STATE
    ============================================================ */
    let currentWord = null;
    let guessedLetters = [];
    let errors = 0;
    let score = 0;
    let usedWords = [];
    let totalWordsGuessed = 0;
    let sessionHighScore = 0;

    /* ============================================================
        INITIALIZATION
    ============================================================ */
    window.addEventListener('DOMContentLoaded', () => {
      // Initialize Firebase
      if (typeof initializeFirebase === 'function') {
        initializeFirebase();
        console.log('🎮 Ahorcado: Firebase initialized');
      }

      createKeyboard();
      initGame();
    });

    function initGame() {
      score = 0;
      usedWords = [];
      totalWordsGuessed = 0;
      sessionHighScore = 0;
      updateScore();
      loadNewWord();
    }

    function createKeyboard() {
      const keyboard = document.getElementById('keyboard');
      keyboard.innerHTML = ALPHABET.map(letter => `
        <button
          id="key-${letter}"
          onclick="selectLetter('${letter}')"
          class="keyboard-btn bg-white hover:bg-purple-100 border-2 border-purple-300 hover:border-purple-500 rounded-xl transition btn-pop text-slate-800">
          ${letter}
        </button>
      `).join('');
    }

    function loadNewWord() {
      // Get all categories
      const categories = Object.keys(vocabulary);

      // Get available words (not used yet)
      let availableWords = [];
      let categoryName = '';

      categories.forEach(cat => {
        vocabulary[cat].forEach(item => {
          if (!usedWords.includes(item.word)) {
            availableWords.push({ ...item, category: cat });
          }
        });
      });

      // If no words left, show results
      if (availableWords.length === 0) {
        showResults();
        return;
      }

      // Pick random word
      const randomIndex = Math.floor(Math.random() * availableWords.length);
      currentWord = availableWords[randomIndex];
      usedWords.push(currentWord.word);

      // Reset game state
      guessedLetters = [];
      errors = 0;

      // Update UI
      document.getElementById('category-badge').textContent = `Category: ${capitalizeFirst(currentWord.category)}`;
      document.getElementById('word-emoji').textContent = currentWord.emoji;
      document.getElementById('hint-text').textContent = currentWord.hint;
      document.getElementById('errors').textContent = errors;
      document.getElementById('max-errors').textContent = MAX_ERRORS;

      // Reset keyboard
      ALPHABET.forEach(letter => {
        const btn = document.getElementById(`key-${letter}`);
        btn.disabled = false;
        btn.classList.remove('bg-red-200', 'bg-green-200');
        btn.classList.add('bg-white');
      });

      // Create word boxes
      createWordBoxes();

      // Clear hangman
      drawHangman();
    }

    function createWordBoxes() {
      const container = document.getElementById('word-container');
      const word = currentWord.word;

      container.innerHTML = word.split('').map((letter, i) => {
        if (letter === ' ') {
          return '<div class="w-4"></div>'; // Space between words
        }
        return `<div class="letter-box" id="box-${i}"></div>`;
      }).join('');
    }

    function selectLetter(letter) {
      const btn = document.getElementById(`key-${letter}`);
      btn.disabled = true;

      guessedLetters.push(letter);

      // Check if letter is in word
      const word = currentWord.word;
      let found = false;

      word.split('').forEach((char, i) => {
        if (char === letter) {
          document.getElementById(`box-${i}`).textContent = letter;
          found = true;
        }
      });

      if (found) {
        btn.classList.add('bg-green-200');
        playSound('correct');

        // Check if word is complete
        if (isWordComplete()) {
          // Trigger confetti immediately
          triggerConfetti();
          totalWordsGuessed++;

          setTimeout(() => {
            score += 10;
            updateScore();

            // Save progress to Firebase after each word
            saveProgressToFirebase();

            nextWord();
          }, 1000);
        }
      } else {
        btn.classList.add('bg-red-200');
        errors++;
        document.getElementById('errors').textContent = errors;
        playSound('wrong');
        drawHangman();

        // Check if game over
        if (errors >= MAX_ERRORS) {
          triggerSadRain();
          setTimeout(() => {
            nextWord();
          }, 2500);
        }
      }
    }

    function isWordComplete() {
      const word = currentWord.word.replace(/ /g, ''); // Remove spaces
      return word.split('').every(letter => guessedLetters.includes(letter));
    }

    function nextWord() {
      loadNewWord();
    }

    function drawHangman() {
      const canvas = document.getElementById('hangman-canvas');
      const ctx = canvas.getContext('2d');

      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#7c3aed';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';

      // Base
      ctx.beginPath();
      ctx.moveTo(10, 240);
      ctx.lineTo(190, 240);
      ctx.stroke();

      // Vertical pole
      ctx.beginPath();
      ctx.moveTo(50, 240);
      ctx.lineTo(50, 20);
      ctx.stroke();

      // Horizontal pole
      ctx.beginPath();
      ctx.moveTo(50, 20);
      ctx.lineTo(150, 20);
      ctx.stroke();

      // Rope
      ctx.beginPath();
      ctx.moveTo(150, 20);
      ctx.lineTo(150, 50);
      ctx.stroke();

      // Draw body parts based on errors
      if (errors >= 1) {
        // Head
        ctx.beginPath();
        ctx.arc(150, 70, 20, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (errors >= 2) {
        // Body
        ctx.beginPath();
        ctx.moveTo(150, 90);
        ctx.lineTo(150, 150);
        ctx.stroke();
      }

      if (errors >= 3) {
        // Left arm
        ctx.beginPath();
        ctx.moveTo(150, 110);
        ctx.lineTo(120, 130);
        ctx.stroke();
      }

      if (errors >= 4) {
        // Right arm
        ctx.beginPath();
        ctx.moveTo(150, 110);
        ctx.lineTo(180, 130);
        ctx.stroke();
      }

      if (errors >= 5) {
        // Left leg
        ctx.beginPath();
        ctx.moveTo(150, 150);
        ctx.lineTo(120, 190);
        ctx.stroke();
      }

      if (errors >= 6) {
        // Right leg
        ctx.beginPath();
        ctx.moveTo(150, 150);
        ctx.lineTo(180, 190);
        ctx.stroke();
      }
    }

    function updateScore() {
      document.getElementById('score').textContent = score;

      // Track session high score
      if (score > sessionHighScore) {
        sessionHighScore = score;
      }
    }

    // Save progress to Firebase
    async function saveProgressToFirebase() {
      if (typeof updatePlayerProgress !== 'function') {
        console.log('⚠️ Ahorcado: Firebase not available');
        return;
      }

      try {
        console.log('🎮 Ahorcado: Saving progress...', {
          score: score,
          highScore: sessionHighScore,
          totalWords: totalWordsGuessed
        });

        const success = await updatePlayerProgress('ahorcado', {
          highScore: sessionHighScore,
          totalWords: totalWordsGuessed,
          lastScore: score,
          lastPlayed: new Date().toISOString()
        });

        if (success) {
          console.log('✅ Ahorcado: Progress saved!');
        } else {
          console.error('❌ Ahorcado: Failed to save progress');
        }
      } catch (error) {
        console.error('❌ Ahorcado: Error saving progress:', error);
      }
    }

    function showResults() {
      // Save final progress
      saveProgressToFirebase();

      document.getElementById('game-card').classList.add('hidden');
      document.getElementById('results-card').classList.remove('hidden');
      document.getElementById('final-score').textContent = score;

      if (typeof confetti === 'function') {
        confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
      }
    }

    function resetGame() {
      document.getElementById('results-card').classList.add('hidden');
      document.getElementById('game-card').classList.remove('hidden');
      initGame();
    }

    function goHome() {
      window.location.href = 'index.html';
    }

    function capitalizeFirst(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    // Efecto de Confeti 🎉
    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 80,
          origin: { y: 0.6 },
          colors: ['#ec4899', '#a855f7', '#f472b6', '#d946ef', '#f97316']
        });
        // Second burst for extra celebration
        setTimeout(() => {
          confetti({
            particleCount: 50,
            angle: 60,
            spread: 55,
            origin: { x: 0, y: 0.6 }
          });
        }, 200);
        setTimeout(() => {
          confetti({
            particleCount: 50,
            angle: 120,
            spread: 55,
            origin: { x: 1, y: 0.6 }
          });
        }, 400);
      }
    }

    // Lluvia de Caritas Tristes 😢
    function triggerSadRain() {
      const container = document.getElementById('sad-overlay');
      const emojis = ['😢', '😭', '💔', '😿'];

      for (let i = 0; i < 18; i++) {
        setTimeout(() => {
          const sadElem = document.createElement('div');
          sadElem.className = 'sad-face';
          sadElem.innerText = emojis[Math.floor(Math.random() * emojis.length)];
          sadElem.style.left = `${Math.random() * 90 + 5}vw`;
          sadElem.style.fontSize = `${Math.random() * 1.5 + 2}rem`;
          sadElem.style.animationDuration = `${Math.random() * 1 + 1.8}s`;

          container.appendChild(sadElem);

          // Remover elemento al terminar animación
          setTimeout(() => {
            sadElem.remove();
          }, 2500);
        }, i * 70);
      }
    }

    // Speak the current word
    function speakWord() {
      if (currentWord && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(currentWord.word);
        utterance.lang = 'en-US';
        utterance.rate = 0.7;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function playSound(type) {
      // Simple audio feedback using Web Audio API
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      if (type === 'correct') {
        oscillator.frequency.value = 800;
        oscillator.type = 'sine';
      } else {
        oscillator.frequency.value = 200;
        oscillator.type = 'sawtooth';
      }

      gainNode.gain.value = 0.1;
      oscillator.start();
      oscillator.stop(audioContext.currentTime + 0.1);
    }
  </script>
